# ==================== 服务器配置 ====================
server:
  port: 8080

# ==================== Spring 主配置 ====================
spring:
  application:
    name: Esshop
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/esshop?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 15000ms
      connect-timeout: 10000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 16
          min-idle: 2
          max-wait: 5000ms
        shutdown-timeout: 200ms
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# ==================== 文件上传目录 ====================
file:
  upload:
    dir: ./esshop-image

# ==================== 智能客服服务（Python + LangChain） ====================
# 未启动 Python 服务时，客服会自动降级到关键词规则库
ai:
  service:
    url: http://localhost:8000
    enabled: true

# ==================== MyBatis-Plus 配置 ====================
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.w.esshop.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ==================== JWT 配置 ====================
jwt:
  secret: esshop-campus-second-hand-trading-platform-secret-key-2024
  expiration: 86400000
  redis-prefix: "esshop:token:"

# ==================== SpringDoc OpenAPI 配置 ====================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# ==================== 日志配置 ====================
logging:
  level:
    com.w.esshop: debug
    org.springframework.web: info